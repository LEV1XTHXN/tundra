name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A red release run costs four cold Rust builds, so gate everything cheaply on
# Linux first. This is the same toolchain the release workflow uses.
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:layering
      - run: npm test
      - run: cargo test --workspace

      # `cargo test` regenerates src/services/bindings.ts as a side effect
      # (the export_bindings test). The file is generated but committed, so a
      # diff here means the committed bindings are stale — and `tsc` will
      # happily pass against stale types, which is why this check exists.
      - name: Check committed bindings are up to date
        run: git diff --exit-code src/services/bindings.ts
