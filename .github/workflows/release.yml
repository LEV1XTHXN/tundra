name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # One job creates the draft release up front and hands its id to the matrix.
  # If every matrix leg let tauri-action find-or-create the release itself they
  # race and you end up with duplicate drafts and assets split between them.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      release_tag: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Create draft prerelease
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Tundra ${tag}`,
              body: fs.readFileSync('.github/RELEASE_NOTES_BETA.md', 'utf8'),
              draft: true,
              prerelease: true,
            });
            core.info(`Created draft release ${data.id} for ${tag}`);
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner on purpose: the deb/AppImage glibc floor is
          # whatever this image ships (2.35), so building on a newer Ubuntu
          # would silently drop Ubuntu 22.04 / Debian 12 users.
          - platform: ubuntu-22.04
            rust-target: ""
            args: ""
          # NSIS only — the MSI needs admin rights and pulls the WiX toolset
          # down at build time, which is an extra flake source for a beta.
          - platform: windows-latest
            rust-target: ""
            args: "--bundles nsis"
          - platform: macos-14
            rust-target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-13
            rust-target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.release_tag }}

      # Tauri v2 needs the webkit2gtk *4.1* line only. The upstream docs example
      # also installs libwebkit2gtk-4.0-dev, which does not exist on
      # ubuntu-24.04 — leaving it out keeps a future runner bump to one word.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The Cargo workspace root is the REPO root (members: crates/tundra-core,
          # src-tauri), so target/ lives there — not under src-tauri/ as in every
          # copy-pasted Tauri workflow. Getting this wrong caches nothing.
          workspaces: ". -> target"
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No signing or updater secrets: these builds are intentionally unsigned
      # for the beta (macOS is ad-hoc signed via bundle.macOS.signingIdentity).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
